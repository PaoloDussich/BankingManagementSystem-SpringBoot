$kind: http-request
url: " http://localhost:8080/api/v1/csrf"
method: GET
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |
      
      const csrf = pm.response.json();

      const idempotencyKey = "019a2e91-7b31-7c42-9a18-f5e64d302b72";

      const depositData = {
          accountNumber: "ACC6",
          amount: 10.00,
          pin: "135790"
      };

      const request = {
          url: "http://localhost:8080/api/v1/transactions/withdrawal",
          method: "POST",
          header: {
              "Content-Type": "application/json",
              [csrf.headerName]: csrf.token,
              "Idempotency-Key": idempotencyKey
          },
          body: {
              mode: "raw",
              raw: JSON.stringify(depositData)
          }
      };

      pm.sendRequest(request, function (error, response) {
          console.log("WITHDRAWAL A:", error || response.code, response?.text());

      });

      pm.sendRequest(request, function (error, response) {
          console.log("WITHDRAWAL B:", error || response.code, response?.text());
      });
    language: text/javascript
order: 3000
